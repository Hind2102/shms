[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shms"
version = "1.0.0"
description = "Site Hazard Management System: AI-assisted hazard reporting, ADOSH-SF risk scoring and closure tracking"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hind Alhmoudi" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# YOLO detector (SH17 weights). Pulls in PyTorch, ~1 GB.
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["shms*"]

[tool.setuptools.package-data]
shms = ["templates/*.html", "static/*", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008: FastAPI's Depends()/File() in defaults is the intended pattern.
# E501: line layout is handled by `ruff format`; remaining long lines are strings / HTML.
# UP042: str+Enum kept for SQLAlchemy Enum compatibility.
ignore = ["B008", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
